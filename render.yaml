services:
  - type: web
    name: hostel-complaint-system
    env: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: hostel-db
          property: connectionString
      - key: NODE_ENV
        value: production

databases:
  - name: hostel-db
    plan: free