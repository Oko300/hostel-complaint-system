<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Hostel Complaint System</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body class="auth-page">
    <div class="auth-card">
        <div class="logo">
            <h1><i class="fas fa-home"></i> HostelCare</h1>
        </div>
        <h2>Welcome Back</h2>
        <p class="text-muted">Log in to manage your complaints</p>

        <form id="loginForm">
            <div class="form-group">
                <label for="loginEmail" class="form-label">Email</label>
                <input type="email" id="loginEmail" class="form-control" placeholder="Enter your email" required>
            </div>
            <div class="form-group">
                <label for="loginPassword" class="form-label">Password</label>
                <input type="password" id="loginPassword" class="form-control" placeholder="Enter your password" required>
            </div>
            <div class="form-group" style="text-align: left;">
                <input type="checkbox" id="rememberMe">
                <label for="rememberMe" class="form-label" style="display: inline; margin-left: 0.5rem;">Remember me</label>
            </div>
            <p id="loginError" class="form-error"></p>
            <button type="submit" id="loginButton" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Login</button>
        </form>
        <p style="margin-top: 1.5rem;">Don't have an account? <a href="/register.html">Register here</a></p>
        <p class="text-muted" style="font-size: 0.85rem; margin-top: 2rem;">Admin? Use your admin credentials.</p>
    </div>

    <script src="/js/auth.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', handleLogin);

        // Redirect if already logged in
        const token = localStorage.getItem('token');
        if (token) {
            const user = JSON.parse(localStorage.getItem('user'));
            if (user && user.role === 'admin') {
                window.location.href = '/admin/dashboard.html';
            } else if (user && user.role === 'student') {
                window.location.href = '/student/dashboard.html';
            }
        }
    </script>
</body>
</html>
